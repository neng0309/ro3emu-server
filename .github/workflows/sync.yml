name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # 07:00 เวลาไทย
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull upstream changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/aethai/ro3emu-server.git
          git fetch upstream main

          # merge โดยให้ upstream ชนะเมื่อ conflict
          git merge upstream/main --allow-unrelated-histories -X theirs --no-commit --no-ff || true

          # ไม่เอาไฟล์ workflow จาก upstream (กัน push โดนบล็อก)
          git reset -q HEAD -- .github || true
          git checkout -- .github 2>/dev/null || true
          git clean -fdq .github || true

          git add -A
          git commit -m "Sync from upstream" || echo "Already up to date"

          git push origin main
